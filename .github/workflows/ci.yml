name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vps-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STUDIO_HOST: studio.example.test
      MEDIA_HOST: media.example.test
      ACME_EMAIL: test@example.test
      EMAIL_FROM: test@example.test
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_ci_fake_never_sent
      POSTGRES_PASSWORD: ci-only-database-password-at-least-32-characters
      APP_DB_PASSWORD: ci-only-app-password-at-least-32-characters
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      APP_VERSION: ci
      EASYPANEL_PROXY_CIDRS: 10.77.0.0/24
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: |
          for script in deploy/vps/*.sh; do bash -n "$script"; done
          python3 tests/test_backup_files.py
          python3 tests/test_hostinger_dns.py
          python3 tests/test_domain_reconcile.py
      - name: Validate Compose configuration
        run: |
          docker compose -f deploy/vps/compose.yaml config --quiet
          docker compose -f deploy/vps/compose.yaml -f deploy/vps/compose.existing.yaml config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); ports=[p for s in c["services"].values() for p in s.get("ports",[])]; assert len(ports)==1 and ports[0]["host_ip"]=="127.0.0.1" and str(ports[0]["published"])=="8088", "Existing-server mode must publish only loopback port 8088"'
          docker compose -f deploy/vps/compose.yaml -f deploy/vps/compose.easypanel.yaml config --format json | python3 -c 'import json,sys; c=json.load(sys.stdin); services=c["services"]; assert all(not s.get("ports") for s in services.values()), "EasyPanel mode must not publish any ports"; assert [name for name,s in services.items() if "easypanel" in s.get("networks",{})]==["caddy"], "Only the gateway may join the shared overlay"; assert sum(int(s["mem_limit"]) for name,s in services.items() if name!="migrate")==4608*1024*1024, "Unexpected pilot memory budget"'
      - name: Build production container
        run: |
          bash deploy/vps/build-limited.sh
          docker tag brilliancy:local brilliancy:ci
      - name: Validate HTTPS proxy configuration
        run: >-
          docker run --rm -e STUDIO_HOST=studio.example.test
          -e MEDIA_HOST=media.example.test -e ACME_EMAIL=test@example.test
          -v "$PWD/deploy/vps:/etc/caddy:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate existing-server proxy configuration
        run: >-
          docker run --rm -e STUDIO_HOST=studio.example.test
          -e MEDIA_HOST=media.example.test
          -v "$PWD/deploy/vps:/etc/caddy:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile.existing --adapter caddyfile
      - name: Validate EasyPanel proxy configuration
        run: >-
          docker run --rm -e STUDIO_HOST=studio.example.test
          -e MEDIA_HOST=media.example.test -e EASYPANEL_PROXY_CIDRS
          -v "$PWD/deploy/vps:/etc/caddy:ro" caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile.easypanel --adapter caddyfile
      - name: Test media routing in all proxy configurations
        run: |
          proxy_image=$(docker create caddy:2-alpine)
          trap 'docker rm "$proxy_image" >/dev/null' EXIT
          docker cp "$proxy_image:/usr/bin/caddy" "$RUNNER_TEMP/caddy-routing-test"
          chmod +x "$RUNNER_TEMP/caddy-routing-test"
          python3 scripts/test-vps-proxy.py "$RUNNER_TEMP/caddy-routing-test"
      - name: Test production database migrations and container startup
        working-directory: deploy/vps
        run: |
          docker compose up -d db
          docker compose run --rm migrate
          docker compose up -d --wait --wait-timeout 120 web worker
          docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/login').then(async r=>{const h=await r.text();if(!r.ok||!r.headers.get('content-security-policy')?.includes('nonce-')||!h.includes('nonce='))process.exit(1)})"
      - name: Verify existing-server HTTP routing and private media isolation
        working-directory: deploy/vps
        run: |
          docker compose -f compose.yaml -f compose.existing.yaml up -d --wait --wait-timeout 120 web caddy
          curl --fail --retry 5 --retry-connrefused -H 'Host: studio.example.test' http://127.0.0.1:8088/api/status
          media_status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: media.example.test' http://127.0.0.1:8088/private/test.pdf)
          test "$media_status" = 404 || { echo "Private media: expected 404, got $media_status"; exit 1; }
          unknown_status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: unknown.example.test' http://127.0.0.1:8088/)
          test "$unknown_status" = 404 || { echo "Unknown host: expected 404, got $unknown_status"; exit 1; }
      - name: Verify EasyPanel overlay and constrained application startup
        working-directory: deploy/vps
        run: |
          docker swarm init --advertise-addr "$(hostname -I | awk '{print $1}')"
          docker network create --driver overlay --attachable --subnet 10.77.0.0/24 easypanel
          docker compose -f compose.yaml -f compose.easypanel.yaml up -d --wait --wait-timeout 120 db web worker caddy
          docker run --rm --network easypanel curlimages/curl:8.12.1 --fail --retry 5 --retry-connrefused -H 'Host: studio.example.test' http://brilliancy-portfolio-gateway:8080/api/status
      - name: Clean up isolated CI containers
        if: always()
        run: docker compose -f deploy/vps/compose.yaml down -v
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
