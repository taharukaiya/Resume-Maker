# Reference fragment for a NEW host-managed Nginx HTTPS virtual host.
# Not a complete server block. Do not include in existing live sites until cutover.
# If Nginx itself is containerized, 127.0.0.1 is not the VPS host; adapt its network first.
client_max_body_size 22m;
access_log off;
location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Brilliancy-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
    proxy_cache off;
}
