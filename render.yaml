# CEO demonstration only. The free PostgreSQL database expires after 30 days.
services:
  - type: web
    name: brilliancy-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DEPLOYMENT_MODE
        value: demo
      - key: AI_PROVIDER
        value: huggingface-browser
      - key: RUN_WORKER
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brilliancy-demo-db
          property: connectionString
databases:
  - name: brilliancy-demo-db
    plan: free
    region: singapore
    databaseName: brilliancy
    user: brilliancy
    ipAllowList: []
